{% extends 'core/base.html' %}
{% block title %}Log In | Expense Tracker{% endblock %}
{% block heading %}Welcome back{% endblock %}
{% block content %}
<section class="form-panel auth-panel">
    <p class="section-kicker">Private financial workspace</p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Email<input type="email" name="email" autocomplete="email" required autofocus></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <div class="form-actions"><a href="/signup/">Create account</a><button type="submit">Log in</button></div>
    </form>
</section>
{% endblock %}
