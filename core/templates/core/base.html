{% load static %}
<!doctype html>
<html lang="en" data-theme="{{ preferences.theme|default:'SYSTEM'|lower }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ledgerly{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
        <rect width='64' height='64' rx='14' fill='%23111111'/>
        <text x='32' y='43'
              text-anchor='middle'
              font-family='Arial, sans-serif'
              font-size='38'
              font-weight='700'
              fill='white'>L</text>
    </svg>">
    <link rel="stylesheet" href="{% static 'core/app.css' %}">

    <link rel="stylesheet" href="{% static 'core/app.css' %}">
</head>
<body>
    <div class="app-shell" id="app-shell">
        <aside class="sidebar" aria-label="Primary navigation">
            <div class="sidebar-top">
                <a class="brand" href="/"><span class="brand-mark">L</span><span class="brand-word">Ledgerly<em>.</em></span></a>
                <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse sidebar" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
            <nav class="nav-list">
                <a class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}" href="/" data-label="Dashboard">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link {% if active_nav == 'people' %}active{% endif %}" href="/people/" data-label="People">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5M16 8.2a2.7 2.7 0 1 1 2.6 3.5M20 19c0-2.4-1.8-4.3-4-5" stroke-linecap="round"/></svg>
                    <span>People</span>
                </a>
                <a class="nav-link {% if active_nav == 'accounts' %}active{% endif %}" href="/accounts/" data-label="Accounts">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 4l9 6.5M4.5 10.5V19h15v-8.5M9 19v-5h6v5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Accounts</span>
                </a>
                <a class="nav-link {% if active_nav == 'transactions' %}active{% endif %}" href="/transactions/" data-label="Transactions">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6h12M6 6v13l3-2 3 2 3-2 3 2V6M9 10h6M9 13h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Transactions</span>
                </a>
                <div class="nav-divider"></div>
                <a class="nav-link action" href="/transactions/new/" data-label="Add transaction">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
                    <span>Add transaction</span>
                </a>
                <a class="nav-link action" href="/money-transfers/new/" data-label="Money transfer">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 8h14M15 4l4 4-4 4M19 16H5M9 12l-4 4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Money transfer</span>
                </a>
                <a class="nav-link action" href="/card-payments/new/" data-label="Card pay">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5h18M7 15h3" stroke-linecap="round"/></svg>
                    <span>Card pay</span>
                </a>
            </nav>
            <form class="sidebar-logout-form" method="post" action="/logout/">
                {% csrf_token %}
                <button type="submit" class="nav-link nav-button logout-link" data-label="Log out" aria-label="Log out">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10M14 8l4 4-4 4M9 12h9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Log out</span>
                </button>
            </form>
            <a class="nav-link settings-link {% if active_nav == 'settings' %}active{% endif %}" href="/settings/" data-label="Settings">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.7a7.6 7.6 0 0 0-1.7-1L15 3h-6l-.4 2.8a7.6 7.6 0 0 0-1.7 1l-2.3-.7-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4-2.3-.7a7.6 7.6 0 0 0 1.7 1L9 21h6l.4-2.8a7.6 7.6 0 0 0 1.7-1l2.3.7 2-3.4-2-1.5Z" stroke-linejoin="round"/></svg>
                <span>Settings</span>
            </a>
        </aside>
        <main class="page-content">
            <header class="topbar">
                <div>
                    <h1>{% block heading %}Dashboard{% endblock %}</h1>
                </div>
                <a class="settings-button" href="/settings/" aria-label="Open settings">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.7a7.6 7.6 0 0 0-1.7-1L15 3h-6l-.4 2.8a7.6 7.6 0 0 0-1.7 1l-2.3-.7-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.7a7.6 7.6 0 0 0 1.7 1L9 21h6l.4-2.8a7.6 7.6 0 0 0 1.7-1l2.3.7 2-3.4-2-1.5Z" stroke-linejoin="round"/></svg>
                </a>
            </header>
            {% block content %}{% endblock %}
        </main>
        <nav class="mobile-nav" aria-label="Mobile navigation">
            <a href="/" class="{% if active_nav == 'dashboard' %}active{% endif %}" aria-label="Dashboard">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a href="/people/" class="{% if active_nav == 'people' %}active{% endif %}" aria-label="People">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5M16 8.2a2.7 2.7 0 1 1 2.6 3.5M20 19c0-2.4-1.8-4.3-4-5" stroke-linecap="round"/></svg>
            </a>
            <button type="button" class="mobile-add" id="mobile-add" aria-haspopup="true" aria-expanded="false" aria-label="Add">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            </button>
            <a href="/accounts/" class="{% if active_nav == 'accounts' %}active{% endif %}" aria-label="Accounts">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 12 4l9 6.5M4.5 10.5V19h15v-8.5M9 19v-5h6v5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a href="/transactions/" class="{% if active_nav == 'transactions' %}active{% endif %}" aria-label="Transactions">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6h12M6 6v13l3-2 3 2 3-2 3 2V6M9 10h6M9 13h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </nav>
        <div class="mobile-add-menu" id="mobile-add-menu">
            <a href="/transactions/new/">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
                Add transaction
            </a>
            <a href="/money-transfers/new/">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 8h14M15 4l4 4-4 4M19 16H5M9 12l-4 4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Money transfer
            </a>
            <a href="/card-payments/new/">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5h18M7 15h3" stroke-linecap="round"/></svg>
                Card payment
            </a>
        </div>
        <div class="scrim" id="scrim"></div>
    </div>
    <script src="{% static 'core/app.js' %}"></script>
</body>
</html>
